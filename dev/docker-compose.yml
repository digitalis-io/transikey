# Local test stack for Transikey: OpenBao (dev mode), PostgreSQL, OpenLDAP.
# Development only. Dev mode keeps everything in memory and uses a fixed root
# token. Never expose this stack beyond localhost.
#
#   docker compose -f dev/docker-compose.yml up -d
#   docker compose -f dev/docker-compose.yml logs init     # setup summary
#   docker compose -f dev/docker-compose.yml down -v

name: transikey-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-transikey-dev}
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:${DEV_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

  openldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: Transikey Dev
      LDAP_DOMAIN: transikey.test
      LDAP_ADMIN_PASSWORD: ${DEV_LDAP_ADMIN_PASSWORD:-transikey-dev}
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost -b \"\" -s base namingContexts >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Creates the LDAP test user. Runs in the OpenLDAP image for its ldap tools.
  ldap-init:
    image: osixia/openldap:1.5.0
    depends_on:
      openldap:
        condition: service_healthy
    environment:
      LDAP_ADMIN_PASSWORD: ${DEV_LDAP_ADMIN_PASSWORD:-transikey-dev}
      DEV_LDAP_USER: ${DEV_LDAP_USER:-ldapdemo}
      DEV_LDAP_USER_PASSWORD: ${DEV_LDAP_USER_PASSWORD:-transikey-dev}
    volumes:
      - ./ldap-init.sh:/ldap-init.sh:ro
    entrypoint: ["/bin/bash", "/ldap-init.sh"]
    restart: "no"

  openbao:
    image: ${DEV_BAO_IMAGE:-openbao/openbao:latest}
    command: server -dev -dev-listen-address=0.0.0.0:8200
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${DEV_BAO_ROOT_TOKEN:-root}
      BAO_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "127.0.0.1:${DEV_BAO_PORT:-8200}:8200"
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 2s
      timeout: 3s
      retries: 30

  init:
    image: ${DEV_BAO_IMAGE:-openbao/openbao:latest}
    depends_on:
      postgres:
        condition: service_healthy
      openbao:
        condition: service_healthy
      ldap-init:
        condition: service_completed_successfully
    environment:
      DEV_LDAP_ADMIN_PASSWORD: ${DEV_LDAP_ADMIN_PASSWORD:-transikey-dev}
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN: ${DEV_BAO_ROOT_TOKEN:-root}
      DEV_POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-transikey-dev}
      DEV_USER: ${DEV_USER:-demo}
      DEV_USER_PASSWORD: ${DEV_USER_PASSWORD:-transikey-dev}
    volumes:
      - ./init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"
